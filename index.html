<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Archive</title>
<meta name="description" content="A personal archive of papers: printed, read, noted, researched.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="navbtn" id="navToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Show fields and topics">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="./"><span class="logo" aria-hidden="true"></span>Paper Archive</a>
  <input type="search" id="search" placeholder="Search papers" aria-label="Search all papers" autocomplete="off">
  <span id="syncDot" class="dot" role="status" aria-label="Loading" title="Loading"></span>
  <button class="add" id="addBtn" type="button"><span aria-hidden="true">+</span> Add</button>
  <button class="gear" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Fields and topics"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main">
    <section class="hero" id="hero">
      <div class="crumb" id="crumb"></div>
      <h1 id="scopeTitle">All papers</h1>
      <div class="progress" id="progress"></div>
    </section>
    <div class="chips" role="group" aria-label="Filter papers">
      <button type="button" class="chip" data-filter="any">All</button>
      <button type="button" class="chip" data-filter="untouched">Not started</button>
      <button type="button" class="chip" data-filter="progress">In progress</button>
      <button type="button" class="chip" data-filter="complete">Done</button>
      <span class="chipsep" aria-hidden="true"></span>
      <button type="button" class="chip star" id="mustRead" aria-pressed="false">★★ Must-reads</button>
      <select id="fSort" aria-label="Sort papers">
        <option value="order">List order</option>
        <option value="new">Newest</option>
        <option value="old">Oldest</option>
        <option value="author">Author</option>
        <option value="recent">Recently ticked</option>
      </select>
    </div>
    <div class="legend" aria-hidden="true" id="legend"></div>
    <div id="list" class="list"></div>
    <div class="more"><button class="pill" id="moreBtn" type="button" hidden>Show more</button></div>
  </main>
</div>

<!-- Edit / add paper -->
<dialog id="paperDlg" aria-labelledby="paperDlgTitle">
  <form method="dialog" id="paperForm">
    <h2 id="paperDlgTitle">Edit paper</h2>
    <div class="tabs" id="addTabs" role="tablist">
      <button type="button" role="tab" data-tab="one" aria-selected="true">One paper</button>
      <button type="button" role="tab" data-tab="bulk" aria-selected="false">Paste a list</button>
    </div>
    <div class="fields" data-pane="one">
      <label>Title<input id="pTitle" required></label>
      <label>Link to the paper<input id="pLink" type="url" placeholder="https://…"></label>
    </div>
    <div data-pane="bulk" hidden>
      <label>One paper per line: <code>Title | Authors | Year | Link</code>
        <textarea id="pBulk" rows="7" placeholder="Power Laws in Economics and Finance | Gabaix, X. | 2009 | https://doi.org/10.1146/annurev.economics.050708.142940"></textarea>
      </label>
    </div>
    <div class="row3">
      <label>Field<input id="pField" list="fieldList" required></label>
      <label>Area <span class="hint">optional</span><input id="pArea" list="areaList"></label>
      <label>Topic<input id="pTopic" list="topicList" required></label>
    </div>
    <div class="fields" data-pane="edit">
      <label>Notes<textarea id="pNotes" rows="3"></textarea></label>
      <label>Research link <span class="hint">your repo or write-up</span><input id="pResearch" type="url" placeholder="https://github.com/…"></label>
    </div>
    <details class="more-details" data-pane="one">
      <summary>More details</summary>
      <div class="fields">
        <div class="row2">
          <label>Authors<input id="pAuthors" placeholder="Surname, A."></label>
          <label>Year<input id="pYear" inputmode="numeric" maxlength="4"></label>
        </div>
        <label>Journal or source<input id="pVenue"></label>
        <label>Subtopic<input id="pSub" list="subList"></label>
        <p class="hint" id="pAbout"></p>
      </div>
    </details>
    <p class="formerr" id="paperErr" hidden></p>
    <div class="dlgfoot">
      <button class="linkbtn danger" type="button" id="pDelete">Remove</button>
      <span class="grow"></span>
      <button class="pill" value="cancel" formnovalidate>Cancel</button>
      <button class="pill primary" id="pSave" value="save">Save</button>
    </div>
  </form>
</dialog>

<!-- New field / topic -->
<dialog id="groupDlg" aria-labelledby="groupDlgTitle">
  <form method="dialog" id="groupForm">
    <h2 id="groupDlgTitle">New field</h2>
    <label id="gFieldWrap">Field name<input id="gField" list="fieldList" required></label>
    <label id="gAreaWrap">Area name<input id="gArea" list="areaList"></label>
    <label id="gTopicWrap">Topic name<input id="gTopic"></label>
    <div class="dlgfoot"><span class="grow"></span><button class="pill" value="cancel" formnovalidate>Cancel</button><button class="pill primary" value="ok">Create</button></div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="setDlg" aria-labelledby="setDlgTitle">
  <form method="dialog" id="setForm">
    <h2 id="setDlgTitle">Settings</h2>
    <p class="hint" id="setStatus"></p>
    <label>GitHub token <span class="hint">needed once per device to save changes</span>
      <input id="sToken" type="password" autocomplete="off" placeholder="github_pat_…">
    </label>
    <p class="hint"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token</a>: only this repo, Contents set to read and write. It stays in this browser.</p>
    <details class="more-details">
      <summary>Repository</summary>
      <div class="fields">
        <div class="row3">
          <label>User<input id="sOwner" autocomplete="off"></label>
          <label>Repo<input id="sRepo" autocomplete="off"></label>
          <label>Branch<input id="sBranch" autocomplete="off" placeholder="main"></label>
        </div>
        <div class="dlgfoot">
          <button class="linkbtn" type="button" id="sExport">Download a backup</button>
          <button class="linkbtn danger" type="button" id="sForget">Remove token from this device</button>
        </div>
      </div>
    </details>
    <p class="formerr" id="setMsg" hidden></p>
    <div class="dlgfoot">
      <button class="pill" type="button" id="sTest">Test</button>
      <span class="grow"></span>
      <button class="pill" value="cancel" formnovalidate>Close</button>
      <button class="pill primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<datalist id="fieldList"></datalist>
<datalist id="areaList"></datalist>
<datalist id="topicList"></datalist>
<datalist id="subList"></datalist>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
